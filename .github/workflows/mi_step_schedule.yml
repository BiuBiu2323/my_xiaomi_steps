name: 修改小米运动步数

on:
  # 定时触发器 - 使用 UTC 时间
  schedule:
    # 例如：每天 UTC 时间 17:00 运行（北京时间 09:00）
    # 更多示例和说明请参考下文
    - cron: '0 17 * * *'
  # 手动触发器 - 允许您在 Actions 页面手动运行工作流进行测试
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12' # 使用项目要求的 Python 版本

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 根据 README 和代码推测，至少需要 requests 库
          pip install requests json re
          # 如果代码实际依赖其他库，请在此处补充安装，例如：
          # pip install python-dotenv # 如果代码确实使用了 .env 文件

      - name: Run my_mi_step.py # 注意：这里指向实际的主脚本文件名
        env:
          # 将 GitHub Secrets 映射为环境变量
          MI_USER: ${{ secrets.MI_USER }}
          MI_PASSWORD: ${{ secrets.MI_PASSWD }}
          MI_MIN_STEPS: ${{ secrets.STEP_MIN }}
          MI_MAX_STEPS: ${{ secrets.STEP_MAX }}
          XM_TG_BOT_TOKEN: ${{ secrets.XM_TG_BOT_TOKEN }}
          XM_TG_USER_ID: ${{ secrets.XM_TG_USER_ID }}
        run: python my_mi_step.py # 执行实际的主脚本
