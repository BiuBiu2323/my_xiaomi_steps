name: 修改小米运动步数

on:
  schedule:
    # 注意：cron 使用 UTC 时间，北京时间 = UTC + 8
    - cron: '0 1 * * *'   # 北京时间每天 09:00
    - cron: '0 9 * * *'   # 北京时间每天 17:00
  # 手动触发器 - 允许在 Actions 页面手动运行工作流进行测试
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run my_mi_step.py
        env:
          # 将 GitHub Secrets 映射为环境变量（脚本同时支持 MI_PASSWD / MI_PASSWORD）
          MI_USER: ${{ secrets.MI_USER }}
          MI_PASSWD: ${{ secrets.MI_PASSWD }}
          MI_PASSWORD: ${{ secrets.MI_PASSWD }}
          STEP_MIN: ${{ secrets.STEP_MIN }}
          STEP_MAX: ${{ secrets.STEP_MAX }}
          # 可选推送通知
          MI_SENDKEY: ${{ secrets.MI_SENDKEY }}
          XM_TG_BOT_TOKEN: ${{ secrets.XM_TG_BOT_TOKEN }}
          XM_TG_USER_ID: ${{ secrets.XM_TG_USER_ID }}
        run: python my_mi_step.py
